name: Build APK Absensi RDMKU

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buat konfigurasi Firebase dummy jika belum tersedia
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "dummy-rdmku-project",
                "storage_bucket": "dummy-rdmku-project.appspot.com"
              },
              "client": [{
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "id.nwkalutara.absensi"
                  }
                },
                "api_key": [{"current_key": "DUMMY_API_KEY_NOT_FOR_PRODUCTION"}]
              }],
              "configuration_version": "1"
            }
            JSON
          fi

      - name: Build APK
        run: gradle assembleDebug assembleRelease

      - name: Simpan APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Absensi-RDMKU-APK-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Simpan APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Absensi-RDMKU-APK-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
